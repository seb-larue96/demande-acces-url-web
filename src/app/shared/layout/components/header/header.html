<mat-toolbar class="mat-elevation-z8">
    @if (mode() === 'over') {
        <button mat-icon-button (click)="toggleSidenav()">
            <mat-icon style="color: white !important;">{{ isOpened() ? 'close' : 'menu' }}</mat-icon>
        </button>
    }
    <span style="flex: 1;"></span>
    <span style="font-weight: bold;">DSI - Demande d'Accès URL</span>
    <span style="flex: 1;"></span>
    <mat-divider [vertical]="true"></mat-divider>
</mat-toolbar>
