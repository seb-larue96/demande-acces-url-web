<app-header></app-header>

<mat-sidenav-container>
    <mat-sidenav #sidenav="matSidenav" class="mat-elevation-z8" [mode]="mode()" [opened]="isOpened()">
        <p class="designation">Bienvenue</p>
        <p class="designation">{{userName()}}</p>
        
        <mat-divider></mat-divider>
  
        <button mat-button class="menu-button" routerLink="/">
            <mat-icon>home</mat-icon>
            <span>Accueil</span>
        </button>
        <button mat-button class="menu-button" routerLink="/mes-demandes-acces">
            <mat-icon>link</mat-icon>
            <span>Mes demandes d'accès</span>
        </button>
        <button *appHasRole="'Admin'" mat-button class="menu-button" routerLink="/toutes-demandes-acces">
            <mat-icon>dataset_linked</mat-icon>
            <span>Toutes demandes d'accès</span>
        </button>
        <button *appHasRole="'Admin'" mat-button class="menu-button" routerLink="/users">
            <mat-icon>groups</mat-icon>
            <span>Utilisateurs</span>
        </button>
        
        <mat-divider></mat-divider>
  
        <button mat-button class="menu-button" routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Profil</span>
        </button>
        <button mat-button class="menu-button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Déconnexion</span>
        </button>
  
    </mat-sidenav>
    <mat-sidenav-content style="background-color:#faf9fd; display: flex; flex-direction: column; flex: 1;">
        <div class="content-wrapper">
            <div class="mat-elevation-z4 main-content">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
