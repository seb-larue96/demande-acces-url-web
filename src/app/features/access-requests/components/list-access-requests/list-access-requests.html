<mat-toolbar>
    <span style="font-weight: bold;">Mes demandes d'accès URL</span>
    <span class="toolbar-spacer"></span>
    <button class="add-request-btn" style="color: #002b5c;" mat-raised-button>
        <mat-icon>add</mat-icon>
        <span class="btn-text">Faire une demnade</span>
    </button>
</mat-toolbar>

<div class="table-container">
    @if (accessRequestService.loadingAccessRequests()) {
        <div class="loading-shade">
            <mat-spinner></mat-spinner>
        </div>
    }
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" >
        <ng-container matColumnDef="requestNumber">
            <th mat-header-cell *matHeaderCellDef> Numéro Demande </th>
            <td mat-cell *matCellDef="let element"> {{element.requestNumber}} </td>
        </ng-container>
        <ng-container matColumnDef="url">
            <th mat-header-cell *matHeaderCellDef> URL </th>
            <td mat-cell *matCellDef="let element"> {{element.url}} </td>
        </ng-container>
        <ng-container matColumnDef="requestStatus">
            <th mat-header-cell *matHeaderCellDef> Statut Demande </th>
            <td mat-cell *matCellDef="let element"> {{element.requestStatus}} </td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button aria-label="Visualiser la demande">
                    <mat-icon color="primary">visibility</mat-icon>
                </button>
                <button mat-icon-button aria-label="Mettre à jour la demande">
                    <mat-icon color="accent">edit</mat-icon>
                </button>
                <button mat-icon-button aria-label="Supprimer la demande">
                    <mat-icon color="warn">delete</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
<mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
